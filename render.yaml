services:
  - type: web
    name: rovia-backend
    env: python
    region: singapore   # closest to India
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: false
      - key: USE_SQLITE_FALLBACK
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: rovia-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      # Set ALLOWED_ORIGINS to your Vercel frontend URL after deployment
      # e.g. https://rovia.vercel.app,https://rovia-git-main-sakthisundar-16.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: REDIS_URL
        value: redis://localhost:6379/0   # Update if using Render Redis

databases:
  - name: rovia-postgres
    databaseName: rovia
    user: rovia
    plan: free
    region: singapore

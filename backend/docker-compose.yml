version: '3.8'

services:
  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=rovia
      - POSTGRES_PASSWORD=rovia_secret
      - POSTGRES_DB=rovia
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=rovia_local_secret_key_12345
      - STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=rovia
      - POSTGRES_PASSWORD=rovia_secret
      - POSTGRES_DB=rovia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: .
    volumes:
      - .:/app
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=rovia
      - POSTGRES_PASSWORD=rovia_secret
      - POSTGRES_DB=rovia
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    command: celery -A app.worker worker --loglevel=info

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
